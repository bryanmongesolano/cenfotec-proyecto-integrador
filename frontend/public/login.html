<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar - Mundo Trendy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary min-vh-100 d-flex align-items-center py-4">
    <main class="container">
      <div id="mensajeSpinner"></div>
      <div id="modalMensajes"></div>

      <div class="card border-0 shadow-lg rounded-4 mx-auto" style="max-width: 460px;">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4">
            <a href="tienda.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
          </div>

          <h1 class="h3 fw-bold mb-4">Iniciar sesión</h1>

          <form id="formLogin">
            <div class="mb-3">
              <label for="correo" class="form-label small fw-medium">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com" required />
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="contrasenna" class="form-label small fw-medium mb-1">Contraseña</label>
                <button
                  type="button"
                  class="btn btn-link btn-sm p-0 text-decoration-none small"
                  data-bs-toggle="modal"
                  data-bs-target="#modalRecuperar"
                >
                  ¿Olvidaste tu contraseña?
                </button>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="contrasenna" placeholder="Tu contraseña" required />
                <button type="button" class="btn btn-outline-secondary" onclick="alternarVisibilidadPassword('contrasenna', this)" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Ingresar</button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small">
            <span class="text-muted">¿Aún no tenés cuenta?</span>
            <a id="linkRegistro" href="registro.html" class="fw-semibold text-decoration-none ms-1">Crear cuenta gratis</a>
          </div>
        </div>
      </div>

      <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Recuperar contraseña</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <form id="formSolicitarToken">
                <p class="small text-muted">
                  Ingresá tu correo para generar un código de recuperación.
                </p>
                <div class="input-group mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="recCorreo"
                    placeholder="tu@correo.com"
                    required
                  />
                  <button type="submit" class="btn btn-outline-primary">Generar código</button>
                </div>
              </form>

              <div id="avisoToken" class="alert alert-info small d-none">
                <div class="fw-semibold mb-1">Código generado (modo demostración):</div>
                <code id="tokenGenerado" class="user-select-all text-break"></code>
              </div>

              <form id="formRestablecer" class="d-none">
                <hr />
                <div class="mb-3">
                  <label class="form-label small" for="recToken">Código de recuperación</label>
                  <input type="text" class="form-control" id="recToken" required />
                </div>
                <div class="mb-3">
                  <label class="form-label small" for="recContrasenna">Nueva contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    id="recContrasenna"
                    minlength="6"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Restablecer contraseña
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
