<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar - Tienda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="container">
      <div class="card shadow login-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Iniciar sesión</h1>
          <p class="text-muted mb-4">Accedé a tu cuenta</p>

          <div id="alerta"></div>

          <form id="formLogin">
            <div class="mb-3">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" class="form-control" id="correo" required />
            </div>

            <div class="mb-3">
              <label for="contrasenna" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="contrasenna" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>

          <div class="d-flex justify-content-between mt-3">
            <a href="tienda.html">Volver a la tienda</a>
            <a href="registro.html">Crear cuenta</a>
          </div>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
