<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <div id="menu"></div>
    </header>

    <main class="container py-4">
      <section>
      <div id="alerta"></div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Productos</h1>
        <button class="btn btn-primary" id="btnNuevo">Nuevo producto</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label" for="buscar">Buscar</label>
              <input type="text" class="form-control" id="buscar" placeholder="Buscar por nombre..." />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="filtroEstado">Estado</label>
              <select class="form-select" id="filtroEstado">
                <option value="">Todos los estados</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th></th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th class="text-end">Precio</th>
                  <th class="text-end">Stock</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </div>
      </div>
          </section>
    </main>

    <div class="modal fade" id="modalProducto" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="formProducto">
            <div class="modal-header">
              <h5 class="modal-title" id="tituloModal">Nuevo producto</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="id" />

              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label" for="nombre">Nombre</label>
                  <input type="text" class="form-control" id="nombre" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="sku">SKU</label>
                  <input type="text" class="form-control" id="sku" />
                </div>

                <div class="col-12">
                  <label class="form-label" for="descripcion">Descripción</label>
                  <textarea class="form-control" id="descripcion" rows="2"></textarea>
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="precio">Precio</label>
                  <input type="number" class="form-control" id="precio" min="0" step="1" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="stock">Stock</label>
                  <input type="number" class="form-control" id="stock" min="0" step="1" value="0" />
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="stockMinimo">Stock mínimo</label>
                  <input type="number" class="form-control" id="stockMinimo" min="0" step="1" value="0" />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="categoria">Categoría</label>
                  <select class="form-select" id="categoria"></select>
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="marca">Marca</label>
                  <input type="text" class="form-control" id="marca" />
                </div>

                <div class="col-12">
                  <label class="form-label" for="imagenes">Imágenes (una URL por línea)</label>
                  <textarea class="form-control" id="imagenes" rows="2"></textarea>
                </div>

                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="viral" />
                    <label class="form-check-label" for="viral">Viral</label>
                  </div>
                </div>

                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="destacado" />
                    <label class="form-check-label" for="destacado">Destacado</label>
                  </div>
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="estado">Estado</label>
                  <select class="form-select" id="estado">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <footer></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/productos.js"></script>
  </body>
</html>
