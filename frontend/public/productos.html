<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Productos e Inventario</h1>
            <button type="button" class="btn btn-primary btn-sm" id="btnNuevo">
              <i class="bi bi-plus-lg me-1"></i>Nuevo producto
            </button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Total productos</div>
                    <div class="fs-4 fw-bold mt-1" id="kpiTotalProd">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-box-seam"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Activos</div>
                    <div class="fs-4 fw-bold text-success mt-1" id="kpiActivosProd">0</div>
                  </div>
                  <span class="rounded-3 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-check-circle"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Stock bajo</div>
                    <div class="fs-4 fw-bold text-danger mt-1" id="kpiStockBajoProd">0</div>
                  </div>
                  <span class="rounded-3 bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-exclamation-triangle"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Valor inventario</div>
                    <div class="fs-4 fw-bold text-primary mt-1" id="kpiValorInv">₡0</div>
                  </div>
                  <span class="rounded-3 bg-info-subtle text-info-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-wallet2"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-4">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Nombre, SKU o marca..." />
                  </div>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="filtroCategoria">Categoría</label>
                  <select class="form-select form-select-sm" id="filtroCategoria">
                    <option value="">Todas</option>
                  </select>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                  </select>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="filtroEspecial">Filtro rápido</label>
                  <select class="form-select form-select-sm" id="filtroEspecial">
                    <option value="">Todos</option>
                    <option value="stockBajo">Stock bajo</option>
                    <option value="sinStock">Agotados</option>
                    <option value="destacado">Destacados</option>
                  </select>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="ordenProductos">Ordenar</label>
                  <select class="form-select form-select-sm" id="ordenProductos">
                    <option value="nombre">Nombre A–Z</option>
                    <option value="precioDesc">Mayor precio</option>
                    <option value="precioAsc">Menor precio</option>
                    <option value="stockAsc">Menor stock</option>
                    <option value="stockDesc">Mayor stock</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th style="width: 68px"></th>
                      <th>Producto</th>
                      <th>Categoría</th>
                      <th class="text-end">Precio</th>
                      <th class="text-end">Stock</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionProductos"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="formProducto">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="tituloModal">Nuevo producto</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="id" />

              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label fw-medium" for="nombre">Nombre del producto</label>
                  <input type="text" class="form-control" id="nombre" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-medium" for="sku">SKU</label>
                  <input type="text" class="form-control text-uppercase" id="sku" placeholder="Ej: PROD-001" />
                </div>

                <div class="col-12">
                  <label class="form-label fw-medium" for="descripcion">Descripción</label>
                  <textarea class="form-control" id="descripcion" rows="2" placeholder="Detalles y características principales..."></textarea>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-medium" for="precio">Precio (₡)</label>
                  <input type="number" class="form-control" id="precio" min="0" step="1" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-medium" for="stock">Stock actual</label>
                  <input type="number" class="form-control" id="stock" min="0" step="1" value="0" />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-medium" for="stockMinimo">Stock mínimo de alerta</label>
                  <input type="number" class="form-control" id="stockMinimo" min="0" step="1" value="3" />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="categoria">Categoría</label>
                  <select class="form-select" id="categoria"></select>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="marca">Marca</label>
                  <input type="text" class="form-control" id="marca" placeholder="Ej: Sony, Apple, Nike..." />
                </div>

                <div class="col-12">
                  <label class="form-label fw-medium" for="imagenes">Imágenes (una URL por línea)</label>
                  <textarea class="form-control" id="imagenes" rows="2" placeholder="https://..."></textarea>
                  <div id="previewImagenes" class="d-flex flex-wrap gap-2 mt-2"></div>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-medium" for="estado">Estado</label>
                  <select class="form-select" id="estado">
                    <option value="true">Activo (visible en tienda)</option>
                    <option value="false">Inactivo (oculto)</option>
                  </select>
                </div>

                <div class="col-md-8 d-flex align-items-end pb-2">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="destacado" />
                    <label class="form-check-label" for="destacado">Mostrar en Destacados</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="modal-footer border-top-0">
              <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar producto</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/productos.js"></script>
  </body>
</html>
