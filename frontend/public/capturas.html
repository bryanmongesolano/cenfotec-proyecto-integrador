<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capturas - Proyecto Integrador 1</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #212529; }
      header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; background: #1f3a5f; color: #fff; flex-wrap: wrap; }
      header h1 { font-size: 1.1rem; margin: 0; }
      select { padding: 6px 10px; border-radius: 6px; border: 0; }
      .galeria { display: flex; gap: 20px; padding: 20px; overflow-x: auto; align-items: flex-start; }
      figure { margin: 0; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      figcaption { font-size: .85rem; color: #6c757d; margin-bottom: 8px; }
      iframe { border: 1px solid #dee2e6; border-radius: 6px; background: #fff; }
    </style>
  </head>

  <body>
    <header>
      <h1>Capturas del proyecto</h1>
      <label for="vista">Pantalla:</label>
      <select id="vista"></select>
    </header>

    <main class="galeria">
      <figure>
        <figcaption>Escritorio (1200 px)</figcaption>
        <iframe id="escritorio" width="1200" height="800" title="Vista de escritorio"></iframe>
      </figure>

      <figure>
        <figcaption>Móvil (390 px)</figcaption>
        <iframe id="movil" width="390" height="800" title="Vista móvil"></iframe>
      </figure>
    </main>

    <script>
      const pantallas = [
        ['Tienda', 'tienda.html'],
        ['Detalle de producto', 'producto.html?id=6aeb426f7fd59ca4275fb2d9'],
        ['Carrito', 'carrito.html'],
        ['Checkout', 'checkout.html'],
        ['Login', 'login.html'],
        ['Registro', 'registro.html'],
        ['Admin - Productos', 'productos.html'],
        ['Admin - Categorías', 'categorias.html'],
        ['Admin - Pedidos', 'pedidos.html'],
        ['Admin - Usuarios', 'usuarios.html'],
        ['Admin - Reseñas', 'resennas.html'],
        ['Admin - Pagos', 'pagos.html']
      ];

      const select = document.getElementById('vista');
      const escritorio = document.getElementById('escritorio');
      const movil = document.getElementById('movil');

      select.innerHTML = pantallas
        .map(([nombre, url], indice) => `<option value="${indice}">${nombre}</option>`)
        .join('');

      function mostrar(indice) {
        const url = pantallas[indice][1];
        escritorio.src = url;
        movil.src = url;
      }

      select.addEventListener('change', () => mostrar(Number(select.value)));
      mostrar(0);
    </script>
  </body>
</html>
