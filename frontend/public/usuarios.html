<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuarios - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Usuarios y Clientes</h1>
            <button type="button" class="btn btn-primary btn-sm" id="btnNuevo">
              <i class="bi bi-person-plus me-1"></i>Nuevo usuario
            </button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Total usuarios</div>
                    <div class="fs-4 fw-bold mt-1" id="kpiTotalUsr">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-people"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Clientes</div>
                    <div class="fs-4 fw-bold text-info mt-1" id="kpiClientesUsr">0</div>
                  </div>
                  <span class="rounded-3 bg-info-subtle text-info-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-person-check"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Administradores</div>
                    <div class="fs-4 fw-bold text-dark mt-1" id="kpiAdminsUsr">0</div>
                  </div>
                  <span class="rounded-3 bg-secondary-subtle text-dark d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-shield-lock"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Inactivos</div>
                    <div class="fs-4 fw-bold text-danger mt-1" id="kpiInactivosUsr">0</div>
                  </div>
                  <span class="rounded-3 bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-person-slash"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-6">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Nombre, correo, cédula o teléfono..." />
                  </div>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroRol">Rol</label>
                  <select class="form-select form-select-sm" id="filtroRol">
                    <option value="">Todos los roles</option>
                    <option value="cliente">Cliente</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Usuario</th>
                      <th>Contacto</th>
                      <th>Cédula</th>
                      <th>Rol</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionUsuarios"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="formUsuario">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="tituloModal">Nuevo usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="id" />

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="nombre">Nombre</label>
                  <input type="text" class="form-control" id="nombre" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="apellido">Apellido</label>
                  <input type="text" class="form-control" id="apellido" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="apellido2">Segundo apellido</label>
                  <input type="text" class="form-control" id="apellido2" />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="cedula">Cédula (9 dígitos)</label>
                  <input type="text" class="form-control" id="cedula" pattern="\d{9}" placeholder="123456789" />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="correo">Correo</label>
                  <input type="email" class="form-control" id="correo" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="telefono">Teléfono</label>
                  <input type="text" class="form-control" id="telefono" placeholder="8888-8888" />
                </div>

                <div class="col-12" id="bloqueContrasenna">
                  <label class="form-label fw-medium" for="contrasenna">Contraseña <small class="text-muted" id="ayudaContrasenna">(mín. 6 caracteres)</small></label>
                  <input type="password" class="form-control" id="contrasenna" minlength="6" />
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="rol">Rol</label>
                  <select class="form-select" id="rol">
                    <option value="cliente">Cliente</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="estado">Estado</label>
                  <select class="form-select" id="estado">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="modal-footer border-top-0">
              <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar usuario</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalDetalleUsuario" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="tituloDetalleUsuario">Ficha de usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="cuerpoDetalleUsuario"></div>
          <div class="modal-footer border-top-0">
            <button type="button" class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
