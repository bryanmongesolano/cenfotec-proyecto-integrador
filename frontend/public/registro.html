<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="container">
      <div class="card shadow login-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Crear cuenta</h1>
          <p class="text-muted mb-4">Registrate para comprar en la tienda</p>

          <div id="alerta"></div>

          <form id="formRegistro">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="apellido">Apellido</label>
                <input type="text" class="form-control" id="apellido" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="correo">Correo</label>
                <input type="email" class="form-control" id="correo" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="telefono">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" />
              </div>
              <div class="col-12">
                <label class="form-label" for="contrasenna">Contraseña</label>
                <input type="password" class="form-control" id="contrasenna" minlength="6" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">Registrarme</button>
          </form>

          <div class="d-flex justify-content-between mt-3">
            <a href="tienda.html">Volver a la tienda</a>
            <a href="login.html">Ya tengo cuenta</a>
          </div>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
  </body>
</html>
