<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta - Mundo Trendy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary min-vh-100 d-flex align-items-center py-4">
    <main class="container">
      <div id="mensajeSpinner"></div>
      <div id="modalMensajes"></div>

      <div class="card border-0 shadow-lg rounded-4 mx-auto" style="max-width: 520px;">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4">
            <a href="tienda.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
          </div>

          <h1 class="h3 fw-bold mb-4">Crear cuenta</h1>

          <form id="formRegistro">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label small fw-medium" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label small fw-medium" for="apellido">Apellido</label>
                <input type="text" class="form-control" id="apellido" required />
              </div>
              <div class="col-12 col-md-7">
                <label class="form-label small fw-medium" for="correo">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com" required />
              </div>
              <div class="col-12 col-md-5">
                <label class="form-label small fw-medium" for="telefono">Teléfono (opcional)</label>
                <input
                  type="tel"
                  class="form-control"
                  id="telefono"
                  pattern="[0-9+\-\s]{8,}"
                  title="Mínimo 8 caracteres (números, espacios, + o -)"
                  placeholder="8888-8888"
                />
              </div>
              <div class="col-12">
                <label class="form-label small fw-medium" for="contrasenna">Contraseña</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="contrasenna" minlength="6" required />
                  <button type="button" class="btn btn-outline-secondary" onclick="alternarVisibilidadPassword('contrasenna', this)" aria-label="Mostrar contraseña">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="progress mt-2" style="height: 5px;">
                  <div class="progress-bar" id="barraFuerzaClave" style="width: 0%"></div>
                </div>
                <small class="text-muted" id="textoFuerzaClave">Mínimo 6 caracteres</small>
              </div>
              <div class="col-12">
                <label class="form-label small fw-medium" for="confirmarContrasenna">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmarContrasenna" minlength="6" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4">Crear mi cuenta</button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small">
            <span class="text-muted">¿Ya tenés una cuenta?</span>
            <a href="login.html" class="fw-semibold text-decoration-none ms-1">Iniciar sesión</a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
  </body>
</html>
