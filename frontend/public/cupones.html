<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cupones - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Cupones y Promociones</h1>
            <button type="button" class="btn btn-primary btn-sm" id="btnNuevo">
              <i class="bi bi-plus-lg me-1"></i>Nuevo cupón
            </button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Total cupones</div>
                    <div class="fs-4 fw-bold mt-1" id="kpiTotalCup">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-ticket-perforated"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Activos vigentes</div>
                    <div class="fs-4 fw-bold text-success mt-1" id="kpiActivosCup">0</div>
                  </div>
                  <span class="rounded-3 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-check-circle"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Usos acumulados</div>
                    <div class="fs-4 fw-bold text-info mt-1" id="kpiUsosCup">0</div>
                  </div>
                  <span class="rounded-3 bg-info-subtle text-info-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-graph-up-arrow"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Expirados / Agotados</div>
                    <div class="fs-4 fw-bold text-danger mt-1" id="kpiExpiradosCup">0</div>
                  </div>
                  <span class="rounded-3 bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-calendar-x"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-5">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Código o descripción..." />
                  </div>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                  </select>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="filtroTipo">Tipo</label>
                  <select class="form-select form-select-sm" id="filtroTipo">
                    <option value="">Todos</option>
                    <option value="porcentaje">Porcentaje (%)</option>
                    <option value="fijo">Monto fijo (₡)</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Código</th>
                      <th>Descuento</th>
                      <th>Compra mín.</th>
                      <th>Usos</th>
                      <th>Vigencia</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionCupones"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="modalCupon" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="formCupon">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="tituloModal">Nuevo cupón</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="id" />

              <div class="mb-3">
                <label class="form-label fw-medium" for="codigo">Código del cupón</label>
                <input type="text" class="form-control text-uppercase font-monospace fw-bold" id="codigo" minlength="3" maxlength="30" placeholder="EJ: BIENVENIDO15" required />
              </div>

              <div class="mb-3">
                <label class="form-label fw-medium" for="descripcion">Descripción</label>
                <input type="text" class="form-control" id="descripcion" placeholder="Ej: Descuento de bienvenida" />
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="tipo">Tipo de descuento</label>
                  <select class="form-select" id="tipo">
                    <option value="porcentaje">Porcentaje (%)</option>
                    <option value="fijo">Monto fijo (₡)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="valor">Valor</label>
                  <input type="number" class="form-control" id="valor" min="1" step="1" required />
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="montoMinimo">Compra mínima (₡)</label>
                  <input type="number" class="form-control" id="montoMinimo" min="0" step="1" value="0" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="usosMaximos">Límite de usos (0 = ilimitado)</label>
                  <input type="number" class="form-control" id="usosMaximos" min="0" step="1" value="0" />
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="fechaExpiracion">Fecha expiración (opcional)</label>
                  <input type="date" class="form-control" id="fechaExpiracion" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="estado">Estado</label>
                  <select class="form-select" id="estado">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="modal-footer border-top-0">
              <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar cupón</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cupones.js"></script>
  </body>
</html>
