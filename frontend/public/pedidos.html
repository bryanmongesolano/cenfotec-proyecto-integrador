<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedidos - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <div id="menu"></div>
    </header>

    <main class="container py-4">
      <section>
      <div id="alerta"></div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Pedidos</h1>
        <select class="form-select w-auto" id="filtroEstado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="pagado">Pagado</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Número</th>
                  <th>Cliente</th>
                  <th>Fecha</th>
                  <th class="text-end">Total</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </div>
      </div>
          </section>
    </main>

    <div class="modal fade" id="modalPedido" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Pedido <span id="detalleNumero"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="text-muted small">Cliente</div>
                <div id="detalleCliente"></div>
              </div>
              <div class="col-md-6">
                <div class="text-muted small">Fecha</div>
                <div id="detalleFecha"></div>
              </div>
            </div>

            <div class="mb-3">
              <div class="text-muted small">Dirección de envío</div>
              <div id="detalleDireccion"></div>
            </div>

            <div class="table-responsive mb-3">
              <table class="table table-sm">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Subtotal</th>
                  </tr>
                </thead>
                <tbody id="detalleItems"></tbody>
              </table>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <div class="text-muted small">Método de pago</div>
                <div id="detallePago"></div>
              </div>
              <div class="col-md-6">
                <div class="text-muted small">Motivo de cancelación</div>
                <div id="detalleMotivo">—</div>
              </div>
            </div>

            <div id="detalleTotales" class="border-top pt-2"></div>
          </div>

          <div class="modal-footer d-flex justify-content-between">
            <div class="d-flex gap-2 align-items-center">
              <select class="form-select" id="nuevoEstado">
                <option value="pendiente">Pendiente</option>
                <option value="pagado">Pagado</option>
                <option value="enviado">Enviado</option>
                <option value="entregado">Entregado</option>
                <option value="cancelado">Cancelado</option>
              </select>
              <button class="btn btn-primary" id="btnEstado">Actualizar estado</button>
            </div>
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
    <footer></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/pedidos.js"></script>
  </body>
</html>
