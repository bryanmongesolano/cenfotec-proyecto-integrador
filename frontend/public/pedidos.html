<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedidos - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Gestión de Pedidos</h1>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Total pedidos</div>
                    <div class="fs-4 fw-bold mt-1" id="kpiTotalPed">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-bag"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Pendientes</div>
                    <div class="fs-4 fw-bold text-warning mt-1" id="kpiPendPed">0</div>
                  </div>
                  <span class="rounded-3 bg-warning-subtle text-warning-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-clock"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Entregados</div>
                    <div class="fs-4 fw-bold text-success mt-1" id="kpiEntregadosPed">0</div>
                  </div>
                  <span class="rounded-3 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-box-seam"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Ingresos válidos</div>
                    <div class="fs-4 fw-bold text-primary mt-1" id="kpiIngresosPed">₡0</div>
                  </div>
                  <span class="rounded-3 bg-info-subtle text-info-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-cash-stack"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-6">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Número de orden, cliente, correo o cupón..." />
                  </div>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="pagado">Pagado</option>
                    <option value="enviado">Enviado</option>
                    <option value="entregado">Entregado</option>
                    <option value="cancelado">Cancelado</option>
                  </select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroMetodo">Método de pago</label>
                  <select class="form-select form-select-sm" id="filtroMetodo">
                    <option value="">Todos</option>
                    <option value="sinpe">SINPE Móvil</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="efectivo">Efectivo</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Orden</th>
                      <th>Cliente</th>
                      <th>Fecha</th>
                      <th>Pago</th>
                      <th class="text-end">Total</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionPedidos"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="modalPedido" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Pedido <span id="detalleNumero" class="text-primary"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <div id="detalleStepper"></div>

            <div class="row g-3 mb-3 small">
              <div class="col-md-6">
                <div class="text-muted">Cliente</div>
                <div class="fw-semibold" id="detalleCliente"></div>
              </div>
              <div class="col-md-6">
                <div class="text-muted">Fecha</div>
                <div class="fw-semibold" id="detalleFecha"></div>
              </div>
              <div class="col-md-6">
                <div class="text-muted">Método de pago</div>
                <div id="detallePago" class="fw-semibold text-capitalize"></div>
              </div>
              <div class="col-md-6">
                <div class="text-muted">Cupón / Motivo</div>
                <div id="detalleMotivo">—</div>
              </div>
              <div class="col-12">
                <div class="text-muted">Dirección de envío</div>
                <div id="detalleDireccion"></div>
              </div>
            </div>

            <div class="table-responsive mb-3">
              <table class="table table-sm align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Producto</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Subtotal</th>
                  </tr>
                </thead>
                <tbody id="detalleItems"></tbody>
              </table>
            </div>

            <div id="detalleTotales" class="border-top pt-2 small"></div>

            <div id="bloqueMotivoCancelacion" class="mt-3 d-none">
              <label class="form-label small text-danger fw-medium" for="motivoCancelacionInput">Motivo de la cancelación</label>
              <input type="text" class="form-control form-control-sm" id="motivoCancelacionInput" placeholder="Ej: Solicitado por el cliente" />
            </div>
          </div>

          <div class="modal-footer d-flex flex-wrap justify-content-between gap-2">
            <div class="d-flex gap-2 align-items-center">
              <select class="form-select form-select-sm" id="nuevoEstado">
                <option value="pendiente">Pendiente</option>
                <option value="pagado">Pagado</option>
                <option value="enviado">Enviado</option>
                <option value="entregado">Entregado</option>
                <option value="cancelado">Cancelado</option>
              </select>
              <button class="btn btn-primary btn-sm text-nowrap" id="btnEstado">Actualizar estado</button>
            </div>
            <button class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/pedidos.js"></script>
  </body>
</html>
