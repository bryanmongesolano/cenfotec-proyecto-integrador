<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tienda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <div id="menu"></div>
    </header>

    <main class="container py-4">
      <div id="alerta"></div>

      <section class="store-hero p-4 p-md-5 mb-4 rounded">
        <h1 class="display-6 fw-semibold">Tienda</h1>
        <p class="mb-0">Encontrá los productos disponibles de nuestro catálogo.</p>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-6">
              <label class="form-label" for="buscar">Buscar</label>
              <input type="search" class="form-control" id="buscar" placeholder="Nombre del producto" />
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label" for="categoria">Categoría</label>
              <select class="form-select" id="categoria">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="col-12 col-md-2">
              <button type="button" class="btn btn-outline-secondary w-100" id="limpiar">Limpiar</button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 class="h5 mb-3">Productos</h2>
        <div class="row g-3" id="grilla"></div>
        <p id="vacio" class="text-center text-muted py-5 d-none">No hay productos para mostrar.</p>
      </section>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menuTienda.js"></script>
    <script src="js/tienda.js"></script>
  </body>
</html>
