<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Categorías - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Categorías</h1>
            <button type="button" class="btn btn-primary btn-sm" id="btnNueva">
              <i class="bi bi-plus-lg me-1"></i>Nueva categoría
            </button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Total categorías</div>
                    <div class="fs-4 fw-bold mt-1" id="kpiTotalCat">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-tags"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Principales</div>
                    <div class="fs-4 fw-bold text-info mt-1" id="kpiPrincipalesCat">0</div>
                  </div>
                  <span class="rounded-3 bg-info-subtle text-info-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-diagram-3"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Subcategorías</div>
                    <div class="fs-4 fw-bold text-secondary mt-1" id="kpiSubCat">0</div>
                  </div>
                  <span class="rounded-3 bg-secondary-subtle text-secondary-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-node-plus"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Activas</div>
                    <div class="fs-4 fw-bold text-success mt-1" id="kpiActivasCat">0</div>
                  </div>
                  <span class="rounded-3 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-check-circle"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-6">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Nombre de la categoría..." />
                  </div>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="true">Activas</option>
                    <option value="false">Inactivas</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Categoría</th>
                      <th>Padre</th>
                      <th class="text-center">Productos</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionCategorias"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="modalCategoria" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="formCategoria">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="tituloModal">Nueva categoría</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="id" />

              <div class="mb-3">
                <label class="form-label fw-medium" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium" for="padre">Categoría padre</label>
                  <select class="form-select" id="padre"></select>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-medium" for="estado">Estado</label>
                  <select class="form-select" id="estado">
                    <option value="true">Activa</option>
                    <option value="false">Inactiva</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="modal-footer border-top-0">
              <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar categoría</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/categorias.js"></script>
  </body>
</html>
