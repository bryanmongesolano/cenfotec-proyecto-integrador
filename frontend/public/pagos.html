<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagos - Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-body-tertiary">
    <div class="d-flex min-vh-100">
      <aside id="adminSidebar"></aside>

      <div class="flex-grow-1 d-flex flex-column min-w-0">
        <header id="adminTopbar"></header>

        <main class="flex-grow-1 p-3 p-lg-4">
          <div id="mensajeSpinner"></div>
          <div id="modalMensajes"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0">Pagos y Conciliación</h1>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Monto aprobado</div>
                    <div class="fs-4 fw-bold text-success mt-1" id="kpiAprobadoMonto">₡0</div>
                  </div>
                  <span class="rounded-3 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-check-circle"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Por verificar</div>
                    <div class="fs-4 fw-bold text-warning mt-1" id="kpiPendPagos">0</div>
                  </div>
                  <span class="rounded-3 bg-warning-subtle text-warning-emphasis d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-hourglass-split"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Aprobados</div>
                    <div class="fs-4 fw-bold text-primary mt-1" id="kpiCantAprobados">0</div>
                  </div>
                  <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-credit-card"></i></span>
                </div>
              </div>
            </div>
            <div class="col-6 col-xl-3">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-start">
                  <div>
                    <div class="text-muted text-uppercase fw-semibold small">Rechazados</div>
                    <div class="fs-4 fw-bold text-danger mt-1" id="kpiCantRechazados">0</div>
                  </div>
                  <span class="rounded-3 bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center fs-5 flex-shrink-0" style="width: 44px; height: 44px;"><i class="bi bi-x-octagon"></i></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-md-5">
                  <label class="form-label small text-muted" for="buscar">Buscar</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control" id="buscar" placeholder="Número de pedido, método o comprobante..." />
                  </div>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label small text-muted" for="filtroEstado">Estado</label>
                  <select class="form-select form-select-sm" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="aprobado">Aprobado</option>
                    <option value="rechazado">Rechazado</option>
                  </select>
                </div>
                <div class="col-6 col-md-2">
                  <label class="form-label small text-muted" for="filtroMetodo">Método</label>
                  <select class="form-select form-select-sm" id="filtroMetodo">
                    <option value="">Todos</option>
                    <option value="sinpe">SINPE Móvil</option>
                    <option value="tarjeta">Tarjeta</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Pedido</th>
                      <th>Método</th>
                      <th class="text-end">Monto</th>
                      <th>Estado</th>
                      <th>Comprobante</th>
                      <th>Fecha</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla"></tbody>
                </table>
              </div>

              <div id="paginacionPagos"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/misc.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/pagos.js"></script>
  </body>
</html>
